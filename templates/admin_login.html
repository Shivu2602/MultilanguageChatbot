<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Multi-Language Chatbot</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6fa;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        .login-container {
            width: 100%;
            max-width: 430px;
        }


        .login-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 35px;
        }


        .login-header {
            margin-bottom: 28px;
        }


        .login-header h1 {
            color: #172554;
            font-size: 27px;
            margin-bottom: 8px;
        }


        .login-header p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }


        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }


        .form-group input {
            width: 100%;
            padding: 13px 14px;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            font-size: 14px;
            font-family: inherit;

            outline: none;
        }


        .form-group input:focus {
            border-color: #2563eb;
        }


        .login-button {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 8px;

            background: #2563eb;
            color: #ffffff;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;
        }


        .error-message {
            display: none;

            margin-bottom: 18px;
            padding: 12px 14px;

            border-radius: 8px;

            background: #fef2f2;
            border: 1px solid #fecaca;

            color: #991b1b;

            font-size: 14px;
        }


        .login-footer {
            margin-top: 22px;

            text-align: center;

            color: #94a3b8;
            font-size: 12px;
        }


        @media (max-width: 500px) {

            .login-card {
                padding: 25px;
            }


            .login-header h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">

        <div class="login-card">


            <div class="login-header">

                <h1>Admin Login</h1>

                <p>
                    Sign in to manage the college information
                    used by the chatbot.
                </p>

            </div>


            <div
                id="errorMessage"
                class="error-message">

                Invalid username or password.

            </div>


            <form id="loginForm">


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required>

                </div>


                <button
                    type="submit"
                    class="login-button">

                    Login

                </button>


            </form>


            <div class="login-footer">

                Multi-Language Chatbot Admin Panel

            </div>


        </div>

    </div>


<script>

    const loginForm =
        document.getElementById("loginForm");

    const errorMessage =
        document.getElementById("errorMessage");


    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const username =
                document.getElementById(
                    "username"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            errorMessage.style.display =
                "none";


            try {

                const response =
                    await fetch(
                        "/admin/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                username: username,
                                password: password
                            })
                        }
                    );


                const result =
                    await response.json();


                if (
                    response.ok &&
                    result.success
                ) {

                    window.location.href =
                        "/admin";

                }

                else {

                    errorMessage.textContent =
                        result.message ||
                        "Invalid username or password.";

                    errorMessage.style.display =
                        "block";

                }

            }

            catch (error) {

                console.error(
                    "Login error:",
                    error
                );


                errorMessage.textContent =
                    "Unable to connect to the server.";

                errorMessage.style.display =
                    "block";

            }

        }
    );

</script>

</body>

</html>
