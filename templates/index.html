<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Multi-Language Chatbot</title>


    <style>

        /* =====================================================
           BASIC RESET
        ====================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =====================================================
           BODY
        ====================================================== */

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6fa;
            color: #1e293b;
            min-height: 100vh;
        }


        /* =====================================================
           MAIN CONTAINER
        ====================================================== */

        .container {
            width: 92%;
            max-width: 1150px;
            margin: 35px auto;
        }


        /* =====================================================
           HEADER
        ====================================================== */

        .chatbot-header {
            text-align: center;
            margin-bottom: 28px;
        }


        .header-text h1 {
            font-size: 34px;
            font-weight: 700;
            color: #172554;
            margin-bottom: 8px;
        }


        .subtitle {
            font-size: 16px;
            color: #64748b;
            margin-bottom: 10px;
        }


        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            color: #15803d;
            font-size: 14px;
            font-weight: 600;
        }


        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
        }


        /* =====================================================
           LANGUAGE SECTION
        ====================================================== */

        .language-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }


        .language-section label {
            font-size: 15px;
            font-weight: 600;
            color: #334155;
        }


        #languageSelect {
            min-width: 140px;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            color: #1e293b;
            font-size: 15px;
            outline: none;
            cursor: pointer;
        }


        #languageSelect:focus {
            border-color: #2563eb;
        }


        /* =====================================================
           CHAT AREA
        ====================================================== */

        .chat-box {
            height: 420px;
            overflow-y: auto;
            padding: 22px;
            background: #ffffff;
            border: 1px solid #dbe3ec;
            border-radius: 14px 14px 0 0;
            box-shadow: 0 3px 15px rgba(15, 23, 42, 0.06);
        }


        .message {
            display: flex;
            width: 100%;
            margin-bottom: 18px;
        }


        .message-content {
            max-width: 70%;
            padding: 13px 17px;
            border-radius: 13px;
            font-size: 15px;
            line-height: 1.55;
            word-wrap: break-word;
            white-space: pre-wrap;
        }


        .user-message {
            justify-content: flex-end;
        }


        .user-message .message-content {
            background: #2563eb;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }


        .bot-message {
            justify-content: flex-start;
        }


        .bot-message .message-content {
            background: #eef2f7;
            color: #1e293b;
            border-bottom-left-radius: 4px;
        }


        /* =====================================================
           INPUT SECTION
        ====================================================== */

        .input-section {
            display: flex;
            gap: 10px;
            padding: 17px;
            background: #ffffff;
            border: 1px solid #dbe3ec;
            border-top: none;
            border-radius: 0 0 14px 14px;
        }


        #messageInput {
            flex: 1;
            min-height: 52px;
            max-height: 150px;
            resize: vertical;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: #ffffff;
            color: #1e293b;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            outline: none;
        }


        #messageInput::placeholder {
            color: #94a3b8;
        }


        #messageInput:focus {
            border-color: #2563eb;
        }


        /* =====================================================
           MAIN BUTTONS
        ====================================================== */

        #sendButton,
        #clearChatButton {
            min-width: 105px;
            padding: 0 20px;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }


        #sendButton {
            background: #2563eb;
            color: #ffffff;
        }


        #clearChatButton {
            background: #e2e8f0;
            color: #334155;
        }


        #sendButton:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }


        /* =====================================================
           TYPING INDICATOR
        ====================================================== */

        .typing {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 16px;
        }


        .typing-content {
            padding: 10px 15px;
            background: #eef2f7;
            color: #64748b;
            border-radius: 13px;
        }


        .typing-dots span {
            display: inline-block;
            margin: 0 2px;
            animation: blink 1.4s infinite;
        }


        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }


        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }


        @keyframes blink {

            0%,
            80%,
            100% {
                opacity: 0.3;
            }

            40% {
                opacity: 1;
            }

        }


        /* =====================================================
           QUICK QUESTIONS
        ====================================================== */

        .quick-section {
            margin-top: 25px;
            padding: 20px;
            background: #ffffff;
            border: 1px solid #dbe3ec;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(15, 23, 42, 0.05);
        }


        .quick-section h3 {
            text-align: center;
            margin-bottom: 16px;
            color: #172554;
            font-size: 19px;
        }


        .quick-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }


        .quick-button {
            padding: 10px 17px;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            background: #f8fbff;
            color: #1d4ed8;
            font-size: 14px;
            cursor: pointer;
        }


        /* =====================================================
           TRANSLATOR
        ====================================================== */

        .translator {
            display: none;
            margin-top: 25px;
            padding: 25px;
            background: #ffffff;
            border: 1px solid #dbe3ec;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(15, 23, 42, 0.06);
        }


        .translator h2 {
            text-align: center;
            margin-bottom: 8px;
            color: #172554;
            font-size: 23px;
        }


        .translator-description {
            max-width: 750px;
            margin: 0 auto 22px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }


        .translator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }


        .translator-column label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: 600;
            color: #334155;
        }


        .translator textarea {
            width: 100%;
            min-height: 140px;
            resize: vertical;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: #ffffff;
            color: #1e293b;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            outline: none;
        }


        .translator textarea:focus {
            border-color: #2563eb;
        }


        .translator-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
        }


        .translator-buttons button {
            min-width: 100px;
            padding: 11px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }


        #translateButton {
            background: #2563eb;
            color: #ffffff;
        }


        #copyButton {
            background: #16a34a;
            color: #ffffff;
        }


        #clearButton {
            background: #e2e8f0;
            color: #334155;
        }


        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        /* =====================================================
           DESKTOP SPACING
        ====================================================== */

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #172554;
        }


        /* =====================================================
           RESPONSIVE DESIGN
        ====================================================== */

        @media (max-width: 800px) {

            .container {
                width: 94%;
                margin: 25px auto;
            }


            .header-text h1 {
                font-size: 28px;
            }


            .chat-box {
                height: 400px;
                padding: 16px;
            }


            .message-content {
                max-width: 85%;
            }


            .input-section {
                flex-direction: column;
            }


            #messageInput {
                width: 100%;
            }


            #sendButton,
            #clearChatButton {
                min-height: 45px;
                width: 100%;
            }


            .translator-grid {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 500px) {

            .container {
                width: 96%;
                margin: 15px auto;
            }


            .header-text h1 {
                font-size: 24px;
            }


            .subtitle {
                font-size: 14px;
            }


            .language-section {
                flex-direction: column;
                align-items: flex-start;
            }


            #languageSelect {
                width: 100%;
            }


            .chat-box {
                height: 380px;
            }


            .message-content {
                max-width: 92%;
                font-size: 14px;
            }


            .quick-section {
                padding: 16px;
            }


            .quick-buttons {
                flex-direction: column;
            }


            .quick-button {
                width: 100%;
            }


            .translator {
                padding: 18px;
            }


            .translator-buttons {
                flex-direction: column;
            }


            .translator-buttons button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         MAIN CONTAINER
    ====================================================== -->

    <div class="container">


        <!-- =================================================
             HEADER
        ================================================== -->

        <div class="chatbot-header">

            <div class="header-text">

                <h1>
                    Multi-Language Chatbot
                </h1>


                <p class="subtitle">
                    English & Kannada NLP Chatbot
                </p>


                <div class="status">

                    <span class="status-dot"></span>

                    Chatbot Online

                </div>

            </div>

        </div>


        <!-- =================================================
             LANGUAGE SELECTION
        ================================================== -->

        <div class="language-section">

            <label for="languageSelect">
                Select Language
            </label>


            <select id="languageSelect">

                <option value="en">
                    English
                </option>


                <option value="kn">
                    Kannada
                </option>

            </select>

        </div>


        <!-- =================================================
             CHAT BOX
        ================================================== -->

        <div id="chatBox" class="chat-box">

            <div class="message bot-message">

                <div class="message-content">
                    Hello! How can I help you?
                </div>

            </div>

        </div>


        <!-- =================================================
             CHAT INPUT
        ================================================== -->

        <div class="input-section">

            <textarea
                id="messageInput"
                placeholder="Type your message in English..."
                rows="2"></textarea>


            <button id="sendButton">
                Send
            </button>


            <button id="clearChatButton">
                Clear Chat
            </button>

        </div>


        <!-- =================================================
             QUICK QUESTIONS
        ================================================== -->

        <div class="quick-section">

            <h3>
                Quick Questions
            </h3>


            <div class="quick-buttons">

                <button
                    class="quick-button"
                    data-en="Where is the college?"
                    data-kn="ಕಾಲೇಜು ಎಲ್ಲಿದೆ?">

                    Where is the college?

                </button>


                <button
                    class="quick-button"
                    data-en="What courses are available?"
                    data-kn="ಯಾವ ಕೋರ್ಸ್‌ಗಳು ಲಭ್ಯವಿವೆ?">

                    What courses are available?

                </button>


                <button
                    class="quick-button"
                    data-en="What are the timings?"
                    data-kn="ಕಾಲೇಜಿನ ಸಮಯ ಏನು?">

                    What are the timings?

                </button>


                <button
                    class="quick-button"
                    data-en="What facilities are available?"
                    data-kn="ಯಾವ ಸೌಲಭ್ಯಗಳು ಲಭ್ಯವಿವೆ?">

                    What facilities are available?

                </button>


                <button
                    class="quick-button"
                    data-en="Contact details"
                    data-kn="ಸಂಪರ್ಕ ವಿವರಗಳು">

                    Contact details

                </button>

            </div>

        </div>


        <!-- =================================================
             TRANSLATOR
        ================================================== -->

        <div id="translator" class="translator">

            <h2>
                Google Translator
            </h2>


            <p class="translator-description">

                Type your message in English and translate it
                into Kannada. Copy the translated text and
                paste it into the chatbot input before sending.

            </p>


            <div class="translator-grid">


                <!-- ENGLISH -->

                <div class="translator-column">

                    <label for="englishText">
                        English
                    </label>


                    <textarea
                        id="englishText"
                        placeholder="Type English text here..."></textarea>

                </div>


                <!-- KANNADA -->

                <div class="translator-column">

                    <label for="kannadaText">
                        Kannada
                    </label>


                    <textarea
                        id="kannadaText"
                        placeholder="Kannada translation will appear here..."
                        readonly></textarea>

                </div>


            </div>


            <!-- TRANSLATOR BUTTONS -->

            <div class="translator-buttons">

                <button id="translateButton">
                    Translate
                </button>


                <button id="copyButton">
                    Copy
                </button>


                <button id="clearButton">
                    Clear
                </button>

            </div>

        </div>
        <!-- =================================================
             JAVASCRIPT
        ================================================== -->

        <script>


            // =================================================
            // GET HTML ELEMENTS
            // =================================================

            const languageSelect =
                document.getElementById("languageSelect");


            const chatBox =
                document.getElementById("chatBox");


            const messageInput =
                document.getElementById("messageInput");


            const sendButton =
                document.getElementById("sendButton");


            const clearChatButton =
                document.getElementById("clearChatButton");


            const translator =
                document.getElementById("translator");


            const englishText =
                document.getElementById("englishText");


            const kannadaText =
                document.getElementById("kannadaText");


            const translateButton =
                document.getElementById("translateButton");


            const copyButton =
                document.getElementById("copyButton");


            const clearButton =
                document.getElementById("clearButton");


            const quickButtons =
                document.querySelectorAll(".quick-button");


            // =================================================
            // LANGUAGE CHANGE
            // =================================================

            languageSelect.addEventListener(
                "change",
                changeLanguage
            );


            function changeLanguage() {

                const selectedLanguage =
                    languageSelect.value;


                if (selectedLanguage === "kn") {

                    translator.style.display =
                        "block";


                    messageInput.placeholder =
                        "ಕನ್ನಡದಲ್ಲಿ ನಿಮ್ಮ ಸಂದೇಶವನ್ನು ಟೈಪ್ ಮಾಡಿ...";

                }


                else {

                    translator.style.display =
                        "none";


                    messageInput.placeholder =
                        "Type your message in English...";

                }


                updateQuickQuestions();

            }


            // =================================================
            // UPDATE QUICK QUESTIONS
            // =================================================

            function updateQuickQuestions() {

                const selectedLanguage =
                    languageSelect.value;


                quickButtons.forEach(
                    function(button) {

                        const question =
                            selectedLanguage === "kn"
                                ? button.getAttribute("data-kn")
                                : button.getAttribute("data-en");


                        button.textContent =
                            question;

                    }
                );

            }


            // =================================================
            // ADD MESSAGE
            // =================================================

            function addMessage(
                message,
                sender
            ) {

                const messageDiv =
                    document.createElement("div");


                messageDiv.classList.add(
                    "message"
                );


                const contentDiv =
                    document.createElement("div");


                contentDiv.classList.add(
                    "message-content"
                );


                if (sender === "user") {

                    messageDiv.classList.add(
                        "user-message"
                    );

                }


                else {

                    messageDiv.classList.add(
                        "bot-message"
                    );

                }


                contentDiv.textContent =
                    message;


                messageDiv.appendChild(
                    contentDiv
                );


                chatBox.appendChild(
                    messageDiv
                );


                chatBox.scrollTop =
                    chatBox.scrollHeight;

            }


            // =================================================
            // SHOW TYPING INDICATOR
            // =================================================

            function showTypingIndicator() {

                const typingDiv =
                    document.createElement("div");


                typingDiv.classList.add(
                    "typing"
                );


                typingDiv.id =
                    "typingIndicator";


                typingDiv.innerHTML = `
                    <div class="typing-content">
                        <div class="typing-dots">
                            <span>●</span>
                            <span>●</span>
                            <span>●</span>
                        </div>
                    </div>
                `;


                chatBox.appendChild(
                    typingDiv
                );


                chatBox.scrollTop =
                    chatBox.scrollHeight;

            }


            // =================================================
            // HIDE TYPING INDICATOR
            // =================================================

            function hideTypingIndicator() {

                const typingIndicator =
                    document.getElementById(
                        "typingIndicator"
                    );


                if (typingIndicator) {

                    typingIndicator.remove();

                }

            }


            // =================================================
            // SEND MESSAGE
            // =================================================

            async function sendMessage() {

                const message =
                    messageInput.value.trim();


                if (!message) {

                    return;

                }


                addMessage(
                    message,
                    "user"
                );


                messageInput.value =
                    "";


                sendButton.disabled =
                    true;


                showTypingIndicator();


                try {

                    const response =
                        await fetch(
                            "/chat",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    message: message
                                })
                            }
                        );


                    const data =
                        await response.json();


                    hideTypingIndicator();


                    if (response.ok) {

                        addMessage(
                            data.response,
                            "bot"
                        );

                    }


                    else {

                        addMessage(
                            "Sorry, something went wrong. Please try again.",
                            "bot"
                        );

                    }

                }


                catch (error) {

                    console.error(
                        "Chat error:",
                        error
                    );


                    hideTypingIndicator();


                    addMessage(
                        "Unable to connect to the chatbot server.",
                        "bot"
                    );

                }


                sendButton.disabled =
                    false;


                messageInput.focus();

            }


            // =================================================
            // SEND BUTTON
            // =================================================

            sendButton.addEventListener(
                "click",
                sendMessage
            );


            // =================================================
            // ENTER KEY
            // =================================================

            messageInput.addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter" &&
                        !event.shiftKey
                    ) {

                        event.preventDefault();

                        sendMessage();

                    }

                }
            );


            // =================================================
            // CLEAR CHAT
            // =================================================

            clearChatButton.addEventListener(
                "click",
                function() {

                    chatBox.innerHTML = `
                        <div class="message bot-message">
                            <div class="message-content">
                                Hello! How can I help you?
                            </div>
                        </div>
                    `;


                    messageInput.value =
                        "";


                    messageInput.focus();

                }
            );


            // =================================================
            // QUICK QUESTION BUTTONS
            // =================================================

            quickButtons.forEach(
                function(button) {

                    button.addEventListener(
                        "click",
                        function() {

                            const selectedLanguage =
                                languageSelect.value;


                            const question =
                                selectedLanguage === "kn"
                                    ? button.getAttribute("data-kn")
                                    : button.getAttribute("data-en");


                            messageInput.value =
                                question;


                            messageInput.focus();

                        }
                    );

                }
            );
            // =================================================
            // TRANSLATOR
            // =================================================

            translateButton.addEventListener(
                "click",
                translateText
            );


            async function translateText() {

                const text =
                    englishText.value.trim();


                if (!text) {

                    alert(
                        "Please enter English text to translate."
                    );

                    return;

                }


                translateButton.disabled =
                    true;


                translateButton.textContent =
                    "Translating...";


                kannadaText.value =
                    "Translating...";


                try {

                    const response =
                        await fetch(
                            "/translate",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    text: text,
                                    target: "kn"
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (response.ok) {

                        kannadaText.value =
                            data.translation;

                    }


                    else {

                        kannadaText.value =
                            data.error ||
                            "Unable to translate.";

                        alert(
                            data.error ||
                            "Unable to translate."
                        );

                    }

                }


                catch (error) {

                    console.error(
                        "Translation error:",
                        error
                    );


                    kannadaText.value =
                        "Unable to connect to translation service.";


                    alert(
                        "Unable to translate. Please try again."
                    );

                }


                translateButton.disabled =
                    false;


                translateButton.textContent =
                    "Translate";

            }


            // =================================================
            // COPY TRANSLATION
            // =================================================

            copyButton.addEventListener(
                "click",
                async function() {

                    const translatedText =
                        kannadaText.value.trim();


                    if (!translatedText) {

                        alert(
                            "There is no translated text to copy."
                        );

                        return;

                    }


                    try {

                        await navigator.clipboard.writeText(
                            translatedText
                        );


                        const originalText =
                            copyButton.textContent;


                        copyButton.textContent =
                            "Copied";


                        setTimeout(
                            function() {

                                copyButton.textContent =
                                    originalText;

                            },
                            1500
                        );

                    }


                    catch (error) {

                        console.error(
                            "Copy error:",
                            error
                        );


                        kannadaText.select();


                        document.execCommand(
                            "copy"
                        );


                        alert(
                            "Kannada translation copied."
                        );

                    }

                }
            );


            // =================================================
            // CLEAR TRANSLATOR
            // =================================================

            clearButton.addEventListener(
                "click",
                function() {

                    englishText.value =
                        "";


                    kannadaText.value =
                        "";


                    englishText.focus();

                }
            );


            // =================================================
            // INITIAL PAGE SETUP
            // =================================================

            changeLanguage();


        </script>


    </div>


</body>

</html>
